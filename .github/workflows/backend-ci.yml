name: Backend CI
on:
  push:
    branches: [main, feat/backend-foundation]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wagering
          POSTGRES_PASSWORD: wagering_dev
          POSTGRES_DB: wagering_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wagering -d wagering_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_USER: wagering
      DATABASE_PASSWORD: wagering_dev
      DATABASE_NAME: wagering_db
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test src/domain
      - run: bun run build
      - run: bunx mikro-orm migration:up
      - run: bun test src/application
        env:
          RUN_DB_TESTS: '1'
      - name: HTTP end-to-end tests (Jest / Node)
        run: node --experimental-vm-modules ./node_modules/jest/bin/jest.js --config ./test/jest-e2e.json --runInBand
        env:
          RUN_DB_TESTS: '1'
