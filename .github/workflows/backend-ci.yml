name: Backend CI

on:
  push:
    branches:
      - main
      - feat/backend-foundation
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
      - name: Domain unit tests
        run: bun test src/domain
      - name: Build
        run: bun run build
